# Staging/drill overlay for compose.prod.yml (ADR-023).
#
#   docker compose -f infra/docker/compose.prod.yml -f infra/docker/compose.drill.yml up -d
#
# It only publishes the bundled PostgreSQL port so migrations and seeds can run
# from outside the compose network, and moves the edge ports away from 80/443
# so a drill never fights the host's real web server. Never use this overlay
# for production traffic.
services:
  postgres:
    ports:
      - '${DRILL_POSTGRES_PORT:-15432}:5432'

  edge:
    ports: !override
      - '${DRILL_HTTP_PORT:-18080}:8080'
      - '${DRILL_HTTPS_PORT:-18443}:8443'
      - '${DRILL_ADMIN_HTTPS_PORT:-18444}:8444'
