# Production topology (ADR-023). Required environment:
#   IMAGE_PREFIX, IMAGE_TAG, POSTGRES_PASSWORD, INTERNAL_ADMIN_TOKEN,
#   PUBLIC_ORIGINS (comma separated https origins), TLS_CERT_DIR
# Do not expose postgres, the API ports or /metrics publicly.
name: web-legend-prod

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/postgres@sha256:a9abf4275f9e99bff8e6aed712b3b7dfec9cac1341bba01c1ffdfce9ff9fc34a}
    environment:
      POSTGRES_USER: web_legend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: web_legend
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U web_legend -d web_legend']
      interval: 5s
      timeout: 3s
      retries: 24
    networks: [backend]

  control-api:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-web-legend}/control-api:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.control-api
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26.13.1-bookworm-slim}
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: '3000'
      GAME_SERVER_INTERNAL_URL: http://game-server:2567
      DATABASE_URL: postgres://web_legend:${POSTGRES_PASSWORD}@postgres:5432/web_legend
      CORS_ORIGINS: ${PUBLIC_ORIGINS:?set PUBLIC_ORIGINS}
      INTERNAL_ADMIN_TOKEN: ${INTERNAL_ADMIN_TOKEN:?set INTERNAL_ADMIN_TOKEN}
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      game-server:
        condition: service_started
    expose: ['3000']
    networks: [backend]

  game-server:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-web-legend}/game-server:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.game-server
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26.13.1-bookworm-slim}
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GAME_SERVER_HOST: 0.0.0.0
      GAME_SERVER_PORT: '2567'
      GAME_SERVER_ID: ${GAME_SERVER_ID:-game-server-1}
      GAME_SERVER_REALM: ${GAME_SERVER_REALM:-classic-01}
      GAME_SERVER_ALLOWED_ORIGINS: ${PUBLIC_ORIGINS:?set PUBLIC_ORIGINS}
      DATABASE_URL: postgres://web_legend:${POSTGRES_PASSWORD}@postgres:5432/web_legend
      INTERNAL_ADMIN_TOKEN: ${INTERNAL_ADMIN_TOKEN:?set INTERNAL_ADMIN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ['2567']
    networks: [backend]

  game-web:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-web-legend}/game-web:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.game-web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26.13.1-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    expose: ['8080']
    networks: [backend]

  admin-web:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-web-legend}/admin-web:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin-web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26.13.1-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    expose: ['8080']
    networks: [backend]

  edge:
    <<: *service-defaults
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - '${HTTP_PORT:-80}:8080'
      - '${HTTPS_PORT:-443}:8443'
      - '${ADMIN_HTTPS_PORT:-8444}:8444'
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - game-web
      - admin-web
      - control-api
      - game-server
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [backend]

  prometheus:
    <<: *service-defaults
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.6.0}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose: ['9090']
    depends_on:
      - control-api
      - game-server
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
