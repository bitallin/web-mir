name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: web_legend
          POSTGRES_PASSWORD: web_legend_dev
          POSTGRES_DB: web_legend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U web_legend -d web_legend"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://web_legend:web_legend_dev@127.0.0.1:5432/web_legend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and dependency boundaries
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: web_legend
          POSTGRES_PASSWORD: web_legend_dev
          POSTGRES_DB: web_legend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U web_legend -d web_legend"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      # The browser run creates and drops its own database from this base
      # connection; it must not share the verify job's schema.
      DATABASE_URL: postgres://web_legend:web_legend_dev@127.0.0.1:5432/web_legend
      E2E_DATABASE_URL: postgres://web_legend:web_legend_dev@127.0.0.1:5432/web_legend_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e
